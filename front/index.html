<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Productos</h1>
  </header>

  <main>
    <p id="mensaje" class="mensaje" hidden></p>

    <section class="panel">
      <h2 id="titulo-formulario">Nuevo producto</h2>

      <!-- novalidate: desactiva las validaciones del navegador para que
           los errores los informe la API (400) y se vean en pantalla -->
      <form id="formulario" novalidate>
        <input type="hidden" id="id">

        <label>Nombre
          <input type="text" id="nombre">
        </label>

        <label>Precio
          <input type="number" id="precio" step="0.01">
        </label>

        <label>Stock
          <input type="number" id="stock" step="1">
        </label>

        <label>Categoría
          <select id="categoria"></select>
        </label>

        <div class="botones">
          <button type="submit">Guardar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <section>
      <div class="encabezado-lista">
        <h2>Listado</h2>

        <label class="filtro">Filtrar por categoría
          <select id="filtro-categoria"></select>
        </label>
      </div>

      <div id="lista" class="lista"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
